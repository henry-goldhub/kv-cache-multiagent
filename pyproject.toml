[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kvbridge"
version = "0.1.0"
description = "A small experiment in same-model and cross-model KV-cache reuse."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.11.0",
    "transformers==5.16.1",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
cloud = [
    "accelerate==1.14.0",
    "bitsandbytes==0.50.2",
    "datasets==4.0.0",
]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[tool.setuptools.packages.find]
include = ["kvbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

